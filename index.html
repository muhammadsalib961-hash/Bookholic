<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOOKHOLIC</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
    }

    /* Header */

    header {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;

      background:
        radial-gradient(circle at top, #292929 0%, #111 45%, #070707 100%);

      border-bottom: 1px solid #292929;
    }

    .hero h1 {
      direction: ltr;
      font-family: Georgia, serif;
      font-size: 58px;
      letter-spacing: 7px;
      margin-bottom: 12px;
    }

    .hero p {
      direction: ltr;
      font-family: Arial, sans-serif;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 3px;
    }

    /* Welcome */

    .welcome {
      text-align: center;
      padding: 55px 20px 25px;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #999;
      font-size: 17px;
    }

    /* Books */

    .books {
      width: 90%;
      max-width: 950px;
      margin: 20px auto 70px;
    }

    .book {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;

      background: linear-gradient(145deg, #1b1b1b, #111);
      border: 1px solid #2c2c2c;
      border-radius: 18px;

      padding: 30px;
      margin-top: 22px;

      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    }

    .book-info {
      flex: 1;
    }

    .book h3 {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .book p {
      color: #999;
      font-size: 16px;
      line-height: 2;
    }

    .read {
      display: inline-block;
      margin-top: 18px;

      background: #f5f5f5;
      color: #111;

      padding: 8px 25px;
      border-radius: 30px;

      text-decoration: none;
      font-family: Arial, sans-serif;
      font-weight: bold;

      transition: 0.2s;
    }

    .read:hover {
      transform: scale(1.05);
      background: #ddd;
    }

    .number {
      width: 75px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #444;
      border-radius: 10px;

      font-family: Georgia, serif;
      font-size: 25px;
      color: #777;
      direction: ltr;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid #222;

      color: #666;
      font-family: Arial, sans-serif;
      font-size: 13px;
      direction: ltr;
    }

    /* Mobile */

    @media (max-width: 600px) {

      header {
        min-height: 300px;
      }

      .hero h1 {
        font-size: 42px;
        letter-spacing: 5px;
      }

      .welcome h2 {
        font-size: 27px;
      }

      .book {
        padding: 22px;
      }

      .book h3 {
        font-size: 24px;
      }

      .number {
        width: 60px;
        height: 85px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="hero">
      <h1>BOOKHOLIC</h1>
      <p>READ • ESCAPE • IMAGINE</p>
    </div>
  </header>


  <section class="welcome">
    <h2>خوش آمدید</h2>
    <p>اپنی پسندیدہ کہانیوں کی دنیا میں قدم رکھیے۔</p>
  </section>


  <section class="books">

    <div class="book">

      <div class="book-info">
        <h3>کافر سے کامل تک</h3>

        <p>
          ایک اردو ناول
        </p>

        <a href="#" class="read">
          پڑھیں
        </a>
      </div>

      <div class="number">
        01
      </div>

    </div>


    <div class="book">

      <div class="book-info">
        <h3>سلطنتِ تاجدار</h3>

        <p>
          ایک اردو ناول
        </p>

        <a href="#" class="read">
          پڑھیں
        </a>
      </div>

      <div class="number">
        02
      </div>

    </div>

  </section>


  <footer>
    BOOKHOLIC © 2026
  </footer>

</body>
</html>
